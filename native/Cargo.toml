[package]
name = "utexo-rgb-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
publish = false

[lib]
path = "node/lib.rs"
crate-type = ["staticlib"]

[dependencies]
rgb-lib = { path = ".sources/rgb-lib-upstream", default-features = false, features = ["electrum", "esplora", "camel_case", "rgb_fs_store_migration"] }
rgb-invoicing = { version = "=0.11.2-rc.2", default-features = false }
electrum-client = { version = "=0.25.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
base64 = "0.23.1"
fs2 = "0.4.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"
tempfile = "3.27.0"
sha2 = "0.11.1"
url = "2.5"


[profile.release]
opt-level = 1
debug = 0
strip = "debuginfo"
# Preserve the upstream rgb-lib release invariant, including for the dependency graph.
overflow-checks = true
